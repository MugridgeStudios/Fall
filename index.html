<!DOCTYPE html>
<html>
<head>
  <title>Dodge the Blocks</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    canvas {
      background: #222;
      margin-top: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #000;
    }

    #score {
      font-size: 24px;
      margin-top: 10px;
    }

    #startButton {
      padding: 10px 20px;
      font-size: 18px;
      margin-top: 10px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #28a745;
      color: white;
    }
  </style>
</head>
<body>

<h1>Dodge the Blocks!</h1>
<div id="score">Score: 0</div>
<button id="startButton">Start Game</button>
<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let player = {x: 180, y: 550, width: 40, height: 40, speed: 5};
let blocks = [];
let score = 0;
let gameOver = false;
let gameRunning = false;
let spawnInterval;
let scoreInterval;
let animationFrame;

function startGame() {
  blocks = [];
  score = 0;
  gameOver = false;
  player.x = 180;
  document.getElementById('score').innerText = "Score: 0";
  gameRunning = true;

  if (animationFrame) cancelAnimationFrame(animationFrame);
  if (spawnInterval) clearInterval(spawnInterval);
  if (scoreInterval) clearInterval(scoreInterval);

  spawnInterval = setInterval(spawnBlock, 1000);
  scoreInterval = setInterval(() => {
    if(gameRunning) {
      score++;
      document.getElementById('score').innerText = "Score: " + score;
    }
  }, 1000); 

  requestAnimationFrame(gameLoop);
}

function spawnBlock() {
  const size = 30 + Math.random()*30;
  const x = Math.random() * (canvas.width - size);
  const speed = 2 + Math.random() * 3;
  blocks.push({x, y: -size, width: size, height: size, speed});
}

function drawBlocks() {
  ctx.fillStyle = '#ff4c4c';
  blocks.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
}

function drawPlayer() {
  // Bright neon player with glow
  ctx.fillStyle = '#00ffff';
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur = 20;
  ctx.fillRect(player.x, player.y, player.width, player.height);
  
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.shadowBlur = 0;
  ctx.strokeRect(player.x, player.y, player.width, player.height);
}

function moveBlocks() {
  blocks.forEach(b => b.y += b.speed);
}

function checkCollision() {
  for (let b of blocks) {
    if (player.x < b.x + b.width &&
        player.x + player.width > b.x &&
        player.y < b.y + b.height &&
        player.y + player.height > b.y) {
      gameOver = true;
      gameRunning = false;
      clearInterval(spawnInterval);
      clearInterval(scoreInterval);
      alert("Game Over! Your score: " + score);
      return;
    }
  }
}

function removeOffscreenBlocks() {
  blocks = blocks.filter(b => b.y < canvas.height);
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  moveBlocks();
  drawBlocks();   
  drawPlayer();  // Always on top with glow
  checkCollision();
  removeOffscreenBlocks();

  if (gameRunning) animationFrame = requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', (e) => {
  if (!gameRunning) return;
  if (e.key === 'ArrowLeft') player.x -= player.speed;
  if (e.key === 'ArrowRight') player.x += player.speed;
  if (player.x < 0) player.x = 0;
  if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
});

document.getElementById('startButton').addEventListener('click', startGame);
</script>

</body>
</html>
